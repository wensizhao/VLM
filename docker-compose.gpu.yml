services:
  vlm-dev:
    image: ${VLM_CUDA_IMAGE:-zgzdocker/vlm-ws:cuda12.1}
    # This pinned PyTorch CUDA base supports x86-64, not Jetson/ARM64.
    platform: linux/amd64
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
