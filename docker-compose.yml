services:
  vlm-dev:
    image: ${VLM_CPU_IMAGE:-zgzdocker/vlm-ws:cpu}
    pull_policy: missing
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    init: true
    working_dir: /workspace/vlm_ws
    stdin_open: true
    tty: true
    shm_size: "${SHM_SIZE:-2gb}"
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      HOME: /tmp/devhome
      SHELL: /usr/bin/zsh
      WORKSPACE_DIR: /workspace/vlm_ws
      VLM_WS_SHARE_DIR: /workspace/vlm_ws/scripts/docker
      PYTHONPATH: /workspace/vlm_ws
      MPLCONFIGDIR: /tmp/devhome/.config/matplotlib
      PIP_CACHE_DIR: /tmp/devhome/.cache/pip
      HF_HOME: /tmp/devhome/.cache/huggingface
      TRANSFORMERS_CACHE: /tmp/devhome/.cache/huggingface/transformers
      TORCH_HOME: /tmp/devhome/.cache/torch
    volumes:
      - type: bind
        source: .
        target: /workspace/vlm_ws
        bind:
          create_host_path: false
          selinux: z
      - dev-home:/tmp/devhome

    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${JUPYTER_PORT:-8888}:8888"
      - "${BIND_ADDRESS:-127.0.0.1}:${TENSORBOARD_PORT:-6006}:6006"
    command: sleep infinity

volumes:
  dev-home:
