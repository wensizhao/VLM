# Apply after docker-compose.yml and, for NVIDIA, docker-compose.gpu.yml.
# Reuse the selected image, workspace, UID/GID and project-local cache volume.
services:
  vlm-dev:
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8000}:8000"
    command: python run_web.py --host 0.0.0.0 --port 8000
