name: CI

on:
  push:
    branches: [main, dev, "feat/**"]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    name: Smoke tests (CPU, py3.10)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements/base.txt
            requirements/ci.txt

      # 先装 CPU 版 torch/torchvision，避免拉取数 GB 的 CUDA wheel；
      # 随后 requirements/ci.txt 中的 torch==2.3.1 视其为已满足，不会重复下载。
      - name: Install CPU PyTorch
        run: pip install torch==2.3.1 torchvision==0.18.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Install project dependencies
        run: pip install -r requirements/ci.txt

      - name: Run smoke tests
        run: pytest -q
